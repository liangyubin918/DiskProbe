# CI：每次推送/PR 自动跑单元测试 + 双架构发布构建验证。
# macos runner 带完整 Xcode（含 swift-testing 与 xcbuild），本地
# CommandLineTools 跑不了的 swift test 在这里兜底。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # runner 镜像预装多个 Xcode，默认选中的可能不含 swift-testing
      # （import Testing 需要 Xcode 16+），这里显式选最新版
      - name: 选择最新 Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version

      - name: Swift 版本
        run: swift --version

      - name: 单元测试
        run: swift test

      - name: 双架构发布构建（Universal 2）
        run: swift build -c release --arch arm64 --arch x86_64
